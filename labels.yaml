  get_balance:                      {reads: private,   sends_external: false}
  get_most_recent_transactions:     {reads: untrusted, sends_external: false}
  get_scheduled_transactions:       {reads: private,   sends_external: false}
  read_file:                        {reads: untrusted, sends_external: false}
  get_user_info:                    {reads: private,   sends_external: false}
  update_password:                  {reads: none,      sends_external: false}
  update_user_info:                 {reads: none,      sends_external: false}
