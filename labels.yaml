  get_hotels_prices:                          {reads: trusted,   sends_external: false}
  get_hotels_address:                         {reads: trusted,   sends_external: false}
  get_rating_reviews_for_hotels:              {reads: untrusted, sends_external: false}
  # restaurants
  get_all_restaurants_in_city:                {reads: trusted,   sends_external: false}
  get_cuisine_type_for_restaurants:           {reads: trusted,   sends_external: false}
  get_restaurants_address:                    {reads: trusted,   sends_external: false}
  get_rating_reviews_for_restaurants:         {reads: untrusted, sends_external: false}
  get_dietary_restrictions_for_all_restaurants: {reads: trusted, sends_external: false}
  get_contact_information_for_restaurants:    {reads: trusted,   sends_external: false}
  get_price_for_restaurants:                  {reads: trusted,   sends_external: false}
  check_restaurant_opening_hours:             {reads: trusted,   sends_external: false}
  # car rental
  get_all_car_rental_companies_in_city:       {reads: trusted,   sends_external: false}
  get_car_types_available:                    {reads: trusted,   sends_external: false}
  get_rating_reviews_for_car_rental:          {reads: untrusted, sends_external: false}
  get_car_fuel_options:                       {reads: trusted,   sends_external: false}
  get_car_rental_address:                     {reads: trusted,   sends_external: false}
  get_car_price_per_day:                      {reads: trusted,   sends_external: false}
  # bookings and communication
  reserve_hotel:                              {reads: none,      sends_external: true}
  reserve_car_rental:                         {reads: none,      sends_external: true}
  reserve_restaurant:                         {reads: none,      sends_external: true}
  get_flight_information:                     {reads: trusted,   sends_external: false}
  send_email:                                 {reads: none,      sends_external: true}
  create_calendar_event:                      {reads: none,      sends_external: true}
  cancel_calendar_event:                      {reads: none,      sends_external: true}
  search_calendar_events:                     {reads: private,   sends_external: false}
  get_day_calendar_events:                    {reads: private,   sends_external: false}

